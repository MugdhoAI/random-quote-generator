[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "random-quote-generator"
version = "1.0.0"
description = "A simple command-line app that displays a random inspirational quote."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "MugdhoAI" }]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8.0,<9.0"]

[project.scripts]
quote = "random_quote.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
